
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>API Monitor</title>
<style>
body{margin:0;background:#020617;color:white;font-family:Inter,Arial}
.container{max-width:1300px;margin:auto;padding:40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.card{background:#0f172a;border:1px solid #1e293b;padding:20px;border-radius:12px}
.chart{background:#0f172a;border:1px solid #1e293b;padding:20px;border-radius:12px;margin-top:20px}
.badge{padding:4px 10px;border-radius:8px;font-size:12px}
.green{background:#064e3b;color:#22c55e}
.yellow{background:#713f12;color:#facc15}
.red{background:#7f1d1d;color:#ef4444}
form{margin-bottom:30px}
input{padding:8px;margin-right:10px;border-radius:6px;border:none}
button{padding:8px 16px;background:#22c55e;border:none;border-radius:6px;color:white}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
