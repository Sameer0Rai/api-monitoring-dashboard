server {
    listen 80;
    # Our custom config replaces the stock default.conf, so the image's entrypoint script
    # (10-listen-on-ipv6-by-default.sh) skips auto-adding this - it only patches the
    # packaged default. Without it, nginx is IPv4-only, and the HEALTHCHECK's
    # "wget http://localhost:80" fails with connection-refused whenever the container's
    # libc resolves "localhost" to ::1 first - the container looks unhealthy even though
    # it serves real (IPv4-mapped) traffic correctly.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file falls back to index.html
    # so client-side routing (react-router-dom) works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container. The frontend is built with
    # VITE_API_BASE_URL=/api so it never needs to know the backend's hostname.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Same reasoning for the backend paths that live alongside /api but aren't under it -
    # actuator (health checks, incl. the dashboard's own "monitor this backend" preset)
    # and Swagger UI. Without these, both fall through to the SPA catch-all below and
    # silently serve index.html instead of the real endpoint.
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # springdoc serves the spec at exactly this path, no trailing slash
    # (springdoc.api-docs.path in application.yml) - swagger-ui.html fetches it as such.
    # An exact match here avoids nginx's prefix-location trailing-slash redirect, whose
    # Location header (built from $host, which knows nothing about Docker's host port
    # mapping) points at the wrong port and breaks the request entirely.
    location = /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
