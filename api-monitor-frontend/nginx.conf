server {
    listen 80;
    # Our custom config replaces the stock default.conf, so the image's entrypoint script
    # (10-listen-on-ipv6-by-default.sh) skips auto-adding this - it only patches the
    # packaged default. Without it, nginx is IPv4-only, and the HEALTHCHECK's
    # "wget http://localhost:80" fails with connection-refused whenever the container's
    # libc resolves "localhost" to ::1 first - the container looks unhealthy even though
    # it serves real (IPv4-mapped) traffic correctly.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # "backend" only exists as a hostname inside Docker Compose's private network - on
    # platforms that run this image standalone (e.g. Render, one container per service),
    # it doesn't resolve at all. A plain `proxy_pass http://backend:8080/...` resolves the
    # hostname once, eagerly, when nginx boots - if that fails, nginx refuses to start
    # entirely, taking the whole site down even though these proxy routes are only used in
    # the Compose deployment (where VITE_API_BASE_URL=/api). Routing proxy_pass through a
    # variable defers resolution to request time via this resolver instead, so a missing
    # "backend" host just 404s a request that was never going to happen on those platforms
    # (VITE_API_BASE_URL there is a full absolute backend URL, so the browser calls it
    # directly and never hits these routes) rather than crashing the container on boot.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream backend:8080;

    # Single-page app: any path that isn't a real file falls back to index.html
    # so client-side routing (react-router-dom) works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container. The frontend is built with
    # VITE_API_BASE_URL=/api so it never needs to know the backend's hostname.
    location /api/ {
        proxy_pass http://$backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Same reasoning for the backend paths that live alongside /api but aren't under it -
    # actuator (health checks, incl. the dashboard's own "monitor this backend" preset)
    # and Swagger UI. Without these, both fall through to the SPA catch-all below and
    # silently serve index.html instead of the real endpoint.
    location /actuator/ {
        proxy_pass http://$backend_upstream/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/ {
        proxy_pass http://$backend_upstream/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://$backend_upstream/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # springdoc serves the spec at exactly this path, no trailing slash
    # (springdoc.api-docs.path in application.yml) - swagger-ui.html fetches it as such.
    # An exact match here avoids nginx's prefix-location trailing-slash redirect, whose
    # Location header (built from $host, which knows nothing about Docker's host port
    # mapping) points at the wrong port and breaks the request entirely.
    location = /v3/api-docs {
        proxy_pass http://$backend_upstream/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://$backend_upstream/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
