services:

  postgres:
    image: postgres:16-alpine
    container_name: monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-api_monitor}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-api_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monitor-network

  backend:
    build:
      context: ./api-monitor-backend
      dockerfile: Dockerfile
    container_name: monitor-backend
    restart: unless-stopped
    # The backend crash-loops if it starts before Postgres is accepting connections,
    # so it waits for the healthcheck above rather than just container-start order.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-api_monitor}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - see .env.example. Generate one with: openssl rand -base64 48}"
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MONITOR_SCHEDULER_FIXED_RATE_MS: ${MONITOR_SCHEDULER_FIXED_RATE_MS:-15000}
      MONITOR_HEALTHCHECK_TIMEOUT_MS: ${MONITOR_HEALTHCHECK_TIMEOUT_MS:-5000}
      MONITOR_HEALTHCHECK_CONCURRENCY: ${MONITOR_HEALTHCHECK_CONCURRENCY:-8}
      MONITOR_HEALTHCHECK_DEFAULT_INTERVAL_S: ${MONITOR_HEALTHCHECK_DEFAULT_INTERVAL_S:-60}
      MONITOR_HEALTHCHECK_MIN_INTERVAL_S: ${MONITOR_HEALTHCHECK_MIN_INTERVAL_S:-15}
      MONITOR_HEALTHCHECK_MAX_INTERVAL_S: ${MONITOR_HEALTHCHECK_MAX_INTERVAL_S:-3600}
      MONITOR_ANALYTICS_WINDOW_DAYS: ${MONITOR_ANALYTICS_WINDOW_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # Spring Boot Actuator's health endpoint - reflects real readiness (DB connectivity
      # included), not just "the process is running".
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - monitor-network

  frontend:
    build:
      context: ./api-monitor-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: monitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge

volumes:
  postgres-data:
